[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-analytic-engine"
version = "0.3.0"
description = "Auditable evidence acquisition, provenance and research control"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
pae-assess = "pae.cli:main"

[tool.setuptools]
packages = ["pae"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
