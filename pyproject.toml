[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-analytic-engine"
version = "0.5.0"
description = "Auditable evidence, domain comparison and probability safety contracts"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
pae-assess = "pae.cli:main"
pae-domain = "pae.domains:main"
pae-probability-contract = "pae.probability_contract:main"

[tool.setuptools]
packages = ["pae"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
